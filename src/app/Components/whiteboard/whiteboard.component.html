<div class="modal-overlay" *ngIf="isModalOpen">
  <div class="modal">
    <div class="modal-header">
      <h2>Whiteboard</h2>
      <button class="close-button" (click)="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="toolbar">
        <input type="color" [(ngModel)]="color" (change)="changeColor(color)" />
        <input
          type="range"
          min="1"
          max="20"
          [(ngModel)]="lineWidth"
          (change)="changeLineWidth(lineWidth)"
        />
        <button (click)="toggleEraser()" [class.active]="isEraserActive">
          Eraser
        </button>
        <button (click)="clearCanvas()">Clear</button>
        <!-- Nút Clear -->
      </div>
      <canvas #canvas></canvas>
    </div>
  </div>
</div>

<button class="open-modal-button" (click)="openModal()">Open Whiteboard</button>
