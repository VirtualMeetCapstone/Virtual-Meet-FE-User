<div class="profile-avatar-container">
  <div
    class="avatar-wrapper"
    [ngClass]="{
      isWatch: !isWatched,
      watched: isWatched,
      'vip-glow': userVipService.isVip()
    }"
    (click)="openStory()"
  >
    <img
      [src]="getSafeUrl(user.avatar)"
      class="profile-pic-large"
      alt="User Profile"
    />
  </div>
  <div class="vip-crown" *ngIf="userVipService.isVip()">
    👑
  </div>
</div>
