<!-- Phần avatar của user -->
<div class="profile-avatar-container">
  <div
    class="avatar-wrapper"
    [ngClass]="{
      isWatch: !isWatched,
      watched: isWatched
    }"
    (click)="openStory()"
  >
    <img [src]="user.avatar" class="profile-pic-large" alt="User Profile" />
  </div>
</div>
