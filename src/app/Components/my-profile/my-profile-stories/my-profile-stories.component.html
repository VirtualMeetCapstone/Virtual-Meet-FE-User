<div class="profile-avatar-container">
  <div
    class="avatar-wrapper"
    [ngClass]="{
      isWatch: !storyService.isViewed(userId),
      watched: storyService.isViewed(userId)
    }"
  >
    <img
      (click)="openStory()"
      [src]="user.avatar"
      class="profile-pic-large"
      alt="User Profile"
    />
  </div>
</div>
