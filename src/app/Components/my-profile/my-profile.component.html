<!-- Loading Indicator -->
<div *ngIf="isLoading" class="loading-container">
  <app-loading-component></app-loading-component>
</div>

<!-- Profile Content -->
<div *ngIf="!isLoading" class="video-side">
  <!-- Profile Section -->
  <div class="profile-container">
    <div class="profile-header-row">
      <div class="profile-header">
        <app-my-profile-stories
          [user]="user"
          [userId]="userId"
        ></app-my-profile-stories>
      </div>
      <div class="profile-info">
        <h2 class="profile-username">{{ user.name }}</h2>
        <p class="profile-username-id">&#64;{{ user.name }}</p>
        <div class="profile-actions">
          <!-- Nếu là profile của người dùng đang đăng nhập -->
          <ng-container *ngIf="isOwnProfile; else followBtn">
            <button class="edit-profile-button" (click)="openEditProfile()">
              Sửa hồ sơ
            </button>
            <button
              class="promote-post-button"
              (click)="openCreateProfileStory()"
            >
              Tạo tin mới
            </button>
            <button
              class="settings-button"
              (click)="openGearButton(); $event.stopPropagation()"
            >
              <i class="fa-solid fa-gear"></i>
            </button>
            <button class="share-button">
              <i class="fa-solid fa-share"></i>
            </button>
          </ng-container>
          <!-- Nếu là profile của người khác -->
          <ng-template #followBtn>
            <button class="edit-profile-button" (click)="toggleFollow()">
              {{ isFollowing ? "Đã Follow" : "Follow" }}
            </button>
            <button class="promote-post-button" (click)="toggleBlock()">
              {{ isBlocked ? "Đã Block" : "Block" }}
            </button>
            <button class="share-button">
              <i class="fa-solid fa-share"></i>
            </button>
          </ng-template>
        </div>
      </div>
    </div>
    <div class="profile-title">
      <div class="follow-info">
        <span>{{ user.followingsCount }} Đang Follow</span>
        <span>{{ user.followersCount }} Follower</span>
        <span>{{ user.friendsCount }} Bạn Bè</span>
      </div>
      <p class="profile-bio">{{ user.bio }}</p>
    </div>

    <!-- Profile Tabs -->
    <div>
      <div class="profile-tabs">
        <div
          class="tab"
          [ngClass]="{ active: selectedTab === 0 }"
          (click)="setTab(0)"
        >
          <i class="fa-solid fa-bookmark"></i> My Posts
        </div>
        <div
          class="tab"
          [ngClass]="{ active: selectedTab === 1 }"
          (click)="setTab(1)"
        >
          <i class="fa-solid fa-bars"></i> Room List
        </div>
        <div
          class="tab"
          [ngClass]="{ active: selectedTab === 2 }"
          (click)="setTab(2)"
        >
          <i class="fa-solid fa-heart"></i> Posts Feed
        </div>
        <div
          class="underline"
          [ngStyle]="{ left: selectedTab * 54 + 'vh' }"
        ></div>
      </div>
      <!-- My Post -->
      <ng-container *ngIf="selectedTab === 0">
        <app-my-post [userId]="userId"></app-my-post>
      </ng-container>
      <!-- Room List -->
      <ng-container *ngIf="selectedTab === 1">
        <app-room-list [userId]="userId"></app-room-list>
      </ng-container>
      <!-- Posts Feed -->
      <ng-container *ngIf="selectedTab === 2">
        <app-posts-feed [userId]="userId"></app-posts-feed>
      </ng-container>
    </div>
  </div>
</div>
