<div class="app-container" style="display: flex">
  <div class="logo">
    <h3
      style="
        font-size: 30px;
        font-weight: 700;
        margin-top: 26px;
        margin-left: 20px;
      "
    >
      <a href="/" style="text-decoration: none; color: white" href="/"
        >VIRTUAL MEET</a
      >
    </h3>
    <div class="mt-4 font-weight-light">
      <app-nav-bar />
    </div>
  </div>
  <!-- Sidebar -->

  <!-- Main Content -->
  <div class="main-content">
    <!-- Header -->
    <div class="header">
      <div class="search-area">
        <input type="text" placeholder="Search" class="search-input" />
      </div>
      <!-- Add the Tải lên button -->
      <button class="upload-button">Tải lên</button>
      <div class="action-item">
        <img
          src="https://storage.googleapis.com/a1aa/image/TfNmA7Vgw-zJGccK-UWYT8GHYlOYJ2yaNRjCJvYY2eM.jpg"
          class="profile-pic"
          alt="User Profile"
        />
      </div>
    </div>

    <!-- Pop-up menu -->
    <div id="profile-popup" class="profile-popup">
      <ul>
        <li><i class="fa fa-user"></i> Trang chủ</li>
        <li><i class="fa fa-sign-out-alt"></i> Đăng xuất</li>
      </ul>
    </div>

    <div class="video-side">
      <!-- Profile Section -->
      <div class="profile-container">
        <div class="profile-header">
          <img
            src="https://storage.googleapis.com/a1aa/image/TfNmA7Vgw-zJGccK-UWYT8GHYlOYJ2yaNRjCJvYY2eM.jpg"
            class="profile-pic-large"
            alt="User Profile"
          />
        </div>
        <div class="profile-title">
          <div class="profile-info">
            <h2 class="profile-username">{{ user.username }}</h2>
            <p class="profile-username-id">{{ user.username }}</p>
          </div>
          <div class="profile-actions">
            <button class="edit-profile-button" (click)="openEditProfile()">
              Sửa hồ sơ
            </button>
            <button class="promote-post-button">Quảng bá bài đăng</button>
            <button class="settings-button">
              <i class="fa-solid fa-gear"></i>
            </button>
            <button class="share-button">
              <i class="fa-solid fa-share"></i>
            </button>
          </div>
          <app-edit-profile-dialog
            *ngIf="isEditing"
            [username]="user.username"
            [bio]="user.bio"
            [avatar]="user.avatar"
            (closeDialog)="closeEditProfile()"
          ></app-edit-profile-dialog>

          <div class="follow-info">
            <span>1 Đang Follow</span>
            <span>0 Follower</span>
            <span>0 Thích</span>
          </div>
          <p class="profile-bio">{{ user.bio }}</p>
        </div>

        <div class="profile-tabs">
          <div class="tab active"><i class="fa-solid fa-bars"></i> Video</div>
          <div class="tab"><i class="fa-solid fa-bookmark"></i> Yêu thích</div>
          <div class="tab"><i class="fa-solid fa-heart"></i> Đã thích</div>
        </div>
      </div>
    </div>
  </div>
</div>
