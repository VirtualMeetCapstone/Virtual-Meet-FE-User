<!-- Sidebar -->
<div *ngIf="isLoading" class="loading-container">
  <app-loading-component />
</div>

<div class="video-side">
  <!-- Profile Section -->
  <div class="profile-container">
    <div class="profile-header-row">
      <div class="profile-header">
        <img [src]="user.avatar" class="profile-pic-large" alt="User Profile" />
      </div>
      <div class="profile-info">
        <h2 class="profile-username">{{ user.name }}</h2>
        <p class="profile-username-id">&#64;{{ user.name }}</p>
        <div class="profile-actions">
          <button class="edit-profile-button" (click)="openEditProfile()">
            Sửa hồ sơ
          </button>
          <button class="promote-post-button">Quảng bá bài đăng</button>
          <button class="settings-button">
            <i class="fa-solid fa-gear"></i>
          </button>
          <button class="share-button">
            <i class="fa-solid fa-share"></i>
          </button>
        </div>
      </div>
    </div>
    <div class="profile-title">
      <div class="follow-info">
        <span>{{ user.followingsCount }} Đang Follow</span>
        <span>{{ user.followersCount }} Follower</span>
        <span>{{ user.friendsCount }} Bạn Bè</span>
      </div>
      <p class="profile-bio">{{ user.bio }}</p>
    </div>

    <!-- Video -->
    <div>
      <div class="profile-tabs">
        <div class="tab active"><i class="fa-solid fa-bars"></i> Room List</div>
        <div class="tab"><i class="fa-solid fa-heart"></i> Posts Feed</div>
        <div class="tab"><i class="fa-solid fa-bookmark"></i> My Posts</div>
      </div>
      <!-- Nếu tab bằng 0, hiển thị danh sách userCreatedPosts -->
      <!-- <ng-container *ngIf="tab === 0; else likedPosts"> -->
      <!-- <ng-container *ngFor="let post of userCreatedPosts"> -->
      <!-- <app-video-item
            [videoURL]="post.video.asset.url"
            [likes]="post.likes?.length || 0"
            [caption]="post.caption"
            [videoId]="post._id"
            (videoClick)="keepScrollBeforeNavigate()"
          >
          </app-video-item> -->
      <!-- </ng-container> -->
      <!-- </ng-container> -->

      <!-- Nếu tab khác 0, hiển thị danh sách userLikedPosts -->
      <div
        className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 pb-4 place-items-center"
      >
        <img
          class="responsive-img"
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQLXvtb1t5We9YQGA0-6HIzN088KMq8JbgcTg&s"
          alt=""
        />
        <img
          class="responsive-img"
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQLXvtb1t5We9YQGA0-6HIzN088KMq8JbgcTg&s"
          alt=""
        />
        <img
          class="responsive-img"
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQLXvtb1t5We9YQGA0-6HIzN088KMq8JbgcTg&s"
          alt=""
        />

        <div
          className="absolute bottom-0 left-0 flex w-full items-center p-2 py-3 text-sm text-white backdrop-blur-sm"
        >
          <!-- <BsHeartFill size="{18}" className="mr-1" /> {millify(likes)} -->
        </div>
      </div>
      <ng-template #likedPosts>
        <!-- <ng-container *ngFor="let post of userLikedPosts"> -->

            [videoURL]="post.video.asset.url"

            (videoClick)="keepScrollBeforeNavigate()"
          >
          </app-video-item> -->

    </div>
  </div>
