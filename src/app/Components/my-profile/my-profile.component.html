<!-- Sidebar -->
<div *ngIf="isLoading" class="loading-container">
  <app-loading-component />
</div>

<div class="video-side">
  <!-- Profile Section -->
  <div class="profile-container">
    <div class="profile-header-row">
      <div class="profile-header">
        <img [src]="user.avatar" class="profile-pic-large" alt="User Profile" />
      </div>
      <div class="profile-info">
        <h2 class="profile-username">{{ user.name }}</h2>
        <p class="profile-username-id">&#64;{{ user.name }}</p>
        <div class="profile-actions">
          <button class="edit-profile-button" (click)="openEditProfile()">
            Sửa hồ sơ
          </button>
          <button class="promote-post-button">Quảng bá bài đăng</button>
          <button class="settings-button">
            <i class="fa-solid fa-gear"></i>
          </button>
          <button class="share-button">
            <i class="fa-solid fa-share"></i>
          </button>
        </div>
      </div>
    </div>
    <div class="profile-title">
      <div class="follow-info">
        <span>{{ user.followingsCount }} Đang Follow</span>
        <span>{{ user.followersCount }} Follower</span>
        <span>{{ user.friendsCount }} Bạn Bè</span>
      </div>
      <p class="profile-bio">{{ user.bio }}</p>
    </div>

    <!-- Profile Tabs -->
    <div>
      <div class="profile-tabs">
        <div
          class="tab"
          [ngClass]="{ active: selectedTab === 0 }"
          (click)="setTab(0)"
        >
          <i class="fa-solid fa-bars"></i> Room List
        </div>
        <div
          class="tab"
          [ngClass]="{ active: selectedTab === 1 }"
          (click)="setTab(1)"
        >
          <i class="fa-solid fa-heart"></i> Posts Feed
        </div>
        <div
          class="tab"
          [ngClass]="{ active: selectedTab === 2 }"
          (click)="setTab(2)"
        >
          <i class="fa-solid fa-bookmark"></i> My Posts
        </div>
        <div
          class="underline"
          [ngStyle]="{ left: selectedTab * 55 + 'vh' }"
        ></div>
      </div>

      <!-- Thay thế phần hiển thị Room List (tab=0) bằng đoạn code này -->
      <ng-container *ngIf="selectedTab === 0">
        <!-- <div *ngIf="isRoomsLoading">Đang load room...</div> -->
        <div class="room-list-container" *ngIf="!isRoomsLoading">
          <div *ngFor="let room of rooms" class="room-item">
            <img
              [src]="
                room.medias && room.medias.length > 0
                  ? room.medias[0].url
                  : './img/virtualMeetImageForNoImage.png'
              "
              alt="{{ room.topic }}"
            />
            <div class="room-topic-overlay">
              <h3>{{ room.topic }}</h3>
            </div>
          </div>
        </div>
      </ng-container>
      <!-- Nội dung tab 1: Posts Feed -->
      <ng-container *ngIf="selectedTab === 1">
        <h2>Posts Feed</h2>
        <!-- ... tuỳ bạn hiển thị gì -->
      </ng-container>

      <!-- Nội dung tab 2: My Posts -->
      <ng-container *ngIf="selectedTab === 2">
        <h2>My Posts</h2>
        <!-- ... tuỳ bạn hiển thị gì -->
      </ng-container>
    </div>
  </div>
</div>
