<!-- src/app/components/lobby/lobby.component.html -->
<div class="lobby-container">
  <div class="header">
    <h1>Topic Quiz:{{ topic }}</h1>
    <p>Waiting for players to join...</p>
  </div>

  <div class="players-list">
    <mat-list>
      <mat-list-item *ngFor="let player of players">{{
        player.name
      }}</mat-list-item>
    </mat-list>
  </div>

  <div class="start-button" *ngIf="isHost">
    <button mat-raised-button color="primary" (click)="startQuizz()">
      Start Quiz
    </button>
  </div>
</div>
