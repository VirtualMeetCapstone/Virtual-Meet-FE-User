<!-- src/app/components/room-selection/room-selection.component.html -->
<div class="room-selection-container">
  <div class="header">
    <h1>Quiz Game</h1>
    <p>Select Quiz</p>
  </div>
  <div class="rooms-grid">
    <mat-card
      *ngFor="let quiz of ListQuiz"
      (click)="selectRoom(quiz.quizzes, quiz.topic)"
      class="room-card"
    >
      <mat-card-header>
        <mat-card-title>{{ quiz.topic }}</mat-card-title>
      </mat-card-header>
    </mat-card>
  </div>
</div>
