<div class="chat-sidebar">
  <div class="chat-header">
    <h3>Chat</h3>
  </div>

  <div class="chat-messages">
    <div *ngFor="let message of messages" class="message" [ngClass]="{ 'self': message.senderId === currentUser }">
      <p class="sender">{{ message.senderId }}</p>
      <p class="text">{{ message.content }}</p>
    </div>
  </div>

  <div class="chat-input">
    <input class="text" type="text" [(ngModel)]="newMessage" placeholder="Type a message..." (keydown.enter)="sendMessage()" />
    <button (click)="sendMessage()">Send</button>
  </div>
</div>
