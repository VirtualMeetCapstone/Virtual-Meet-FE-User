<div class="chat-sidebar">
  <div class="chat-header">
    <h3>Chat</h3>

  </div>
  <div class="chat-messages">
    <div *ngFor="let message of messages" class="message" [ngClass]="{ 'self': message.sender === 'me' }">
      <p class="sender">{{ message.sender }}</p>
      <p class="text">{{ message.text }}</p>
    </div>
  </div>
  <div class="chat-input">
    <input class="text" type="text" [(ngModel)]="newMessage" placeholder="Type a message..." (keydown.enter)="sendMessage()" />
    <button (click)="sendMessage()">Send</button>
  </div>
</div>
