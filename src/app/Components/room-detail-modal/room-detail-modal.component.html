<div class="modal" (click)="onBackgroundClick($event)">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="title">
      <i
        class="fa-solid fa-x iconX d-flex justify-content-end"
        style="cursor: pointer"
        (click)="closeModal()"
      ></i>
      <div class="owner-info">
        <img class="owner-avt" [src]="data.room.owner.picture.url" alt="">
        <h3>{{data.room.owner.name}}'s room</h3>

      </div>

    </div>
    <div class="container" style="margin-top: 10px">
      <div class="row">
        <div class="col-md-8">
          <div id="roomCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
              <div *ngFor="let media of data.room.medias; let i = index"
                   class="carousel-item"
                   [ngClass]="{'active': i === 0}">
                <img [src]="media.url" class="d-block w-100" alt="Room Image">
              </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#roomCarousel" data-bs-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#roomCarousel" data-bs-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
            </button>
          </div>
        </div>
        <div class="col-md-4">
          <p><strong>Room name:</strong> {{ data.room.topic }}</p>
          <p><strong>Description:</strong> {{ data.room.description }}</p>
          <p><strong>Max participants:</strong> {{ data.room.maximumMembers }}</p>
          <p>Privacy: Public</p>
          <div class="row">

            <div class="col-md-4">
              <button class="join-now">Join</button>

            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
