    </div>
    <div *ngIf="!isChatOpen" class="chat-sidebar">
      <button class="attendee"><i class="fa-solid fa-users-line"></i></button>

      <button class="chat-box" (click)="toggleChat()"><i class="fa-brands fa-rocketchat"></i></button>
    </div>
    <div *ngIf="isChatOpen" class="chat-sidebar">
