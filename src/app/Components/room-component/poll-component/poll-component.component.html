<div *ngIf="poll">
  <h3>{{ poll.question }}</h3>
  <div *ngFor="let option of poll.options">
    <button [disabled]="hasVoted" (click)="voteOption(option.id)">
      {{ option.text }} ({{ option.votes }} votes)
    </button>
  </div>
  <p *ngIf="hasVoted">You have already voted.</p>
</div>
<div *ngIf="!poll && !isCreatingPoll">
  <p>No active poll</p>
  <button (click)="startCreatingPoll()">Create Poll</button>
</div>
<div *ngIf="isCreatingPoll">
  <input [(ngModel)]="newQuestion" placeholder="Enter poll question" />
  <div *ngFor="let option of newOptions; let i = index">
    <input [(ngModel)]="newOptions[i]" placeholder="Option {{ i + 1 }}" />
  </div>
  <button (click)="addOption()">Add Option</button>
  <button (click)="submitPoll()">Create Poll</button>
</div>
