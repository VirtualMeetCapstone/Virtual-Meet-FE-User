<div class="password-modal">
  <div class="modal-overlay" (click)="onCloseModal()"></div>

  <div class="modal-container">
    <div class="modal-header">
      <h3 class="modal-title">{{ 'room_password.TITLE' | translate }}</h3>
      <button class="close-btn" (click)="onCloseModal()">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div class="modal-body">
      <div class="form-group">
        <label for="password">{{ 'room_password.LABEL' | translate }}</label>
        <input
          type="password"
          id="password"
          class="form-input"
          placeholder="Enter password"
          [(ngModel)]="password"
          #passwordField="ngModel"
        />
        <div class="error-message" *ngIf="!password && passwordField.dirty">
          <i class="fas fa-exclamation-circle"></i> {{ 'room_password.REQUIRED' | translate }}
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="cancel-btn" (click)="onCloseModal()">{{ 'room_password.CANCEL' | translate }}</button>
      <button class="join-btn" [disabled]="!password" (click)="joinRoom()">
        {{ 'room_password.JOIN' | translate }}
      </button>
    </div>
  </div>
</div>
