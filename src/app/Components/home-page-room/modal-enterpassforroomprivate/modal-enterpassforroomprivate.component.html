<div class="password-modal">
  <div class="modal-overlay" (click)="onCloseModal()"></div>

  <div class="modal-container">
    <div class="modal-header">
      <h3 class="modal-title">Enter Room Password</h3>
      <button class="close-btn" (click)="onCloseModal()">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div class="modal-body">
      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          class="form-input"
          placeholder="Enter password"
          [(ngModel)]="password"
          #passwordField="ngModel"
        />
        <div class="error-message" *ngIf="!password && passwordField.dirty">
          <i class="fas fa-exclamation-circle"></i> Password is required
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="cancel-btn" (click)="onCloseModal()">Cancel</button>
      <button class="join-btn" [disabled]="!password" (click)="joinRoom()">
        Join Room
      </button>
    </div>
  </div>
</div>
