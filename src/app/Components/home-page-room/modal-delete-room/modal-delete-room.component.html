<div class="modal-delete-wrapper">
  <div class="modal-backdrop" (click)="onCloseModal()"></div>

  <div class="modal-delete-container">
    <div class="modal-header">
      <h2>
        <i class="fa-solid fa-triangle-exclamation text-warning"></i>
        Delete Room
      </h2>
      <button class="btn-close" (click)="onCloseModal()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="room-preview">
      <!-- Hình phòng với fallback -->
      <div class="room-image-container">
        <ng-container *ngIf="room.medias?.length; else noImage">
          <img [src]="room.medias[0].url" alt="Room image" class="room-image" />
        </ng-container>
        <ng-template #noImage>
          <div class="room-image-placeholder">
            <i class="fa-solid fa-image"></i>
          </div>
        </ng-template>
      </div>

      <!-- Topic -->
      <div class="room-topic-container">
        <h3 class="room-topic">{{ room.topic || "Untitled Room" }}</h3>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-secondary" (click)="onCloseModal()">Cancel</button>
      <button class="btn btn-danger" (click)="onDeleteRoom()">
        <i class="fa-solid fa-trash-can"></i> Delete
      </button>
    </div>
  </div>
</div>
<div class="fullscreen-spinner text-center" *ngIf="loading">
  <app-loading-component></app-loading-component>
</div>
