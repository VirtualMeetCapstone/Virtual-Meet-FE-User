<div
  class="alert alert-secondary"
  role="alert"
  style="text-align: center; font-size: large; font-weight: bold"
  *ngFor="let message of messages"
>
  {{ message }}
</div>
<div>
  <div class="row">
    <div class="col-12 text-center p-3">
      <app-story-list></app-story-list>
    </div>
  </div>
  <div class="d-flex justify-content-center">
    <div class="row">
      <div
        class="col-12 col-sm-6 col-md-4 col-lg-3 mt-4 col-lon d-flex justify-content-center"
        *ngFor="let room of rooms"
      >
        <div class="card text-center room-card">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="marquee">
              <h5 class="mb-0">{{ room.topic }}</h5>
            </div>

            <div class="d-flex align-items-center">
              <div class="dropdown">
                <button
                  class="btn btn-secondary dropdown-toggle"
                  type="button"
                  data-toggle="dropdown"
                  aria-haspopup="true"
                  aria-expanded="false"
                >
                  <i class="fas fa-cog settings"> </i>
                </button>
                <div class="dropdown-menu">
                  <div class="group-owner">
                    <div style="color: black">Group Owner</div>
                    <img
                      src="{{ room.owner.picture.url }}"
                      alt="Owner Avatar"
                      class="owner-avatar"
                      style="height: 50px; width: 50px"
                    />
                    <p style="color: #666">{{ room.owner.name }}</p>
                    <p style="color: #666; line-height: 2px; font-size: 14px">
                      Create At
                    </p>
                    <p style="color: #666; line-height: 2px; font-size: 14px">
                      {{ room.createTime }}
                    </p>
                    <i
                      class="fa-solid fa-trash text-danger"
                      *ngIf="user?.id == room.ownerId"
                      (click)="openModalDeleteRoom(room)"
                    ></i>
                    <i
                      class="fas fa-pen text-primary ml-3"
                      *ngIf="user?.id == room.ownerId"
                      (click)="openModalEditRoom(room)"
                    ></i>
                  </div>
                </div>
              </div>
              <i class="fa-solid fa-lock pl-2" *ngIf="room.privacy"></i>
            </div>
          </div>
          <div class="mb-3">
            <img
              [src]="
                room.medias.length
                  ? room.medias[0].url
                  : 'https://denngocson.com/wp-content/uploads/2024/10/anh-mau-trang-87BaWJLP.jpg'
              "
              class="img-fluid room-image"
            />
          </div>
          <p class="mb-3 text-start">
            {{
              room.description.length > 30
                ? (room.description | slice : 0 : 30) + "..."
                : room.description
            }}
          </p>

          <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
              <i class="fas fa-users mr-1"></i> 0/{{ room.maximumMembers }}
            </div>
            <div>
              <img
                *ngFor="let member of room.members.slice(0, 2)"
                [src]="member.picture"
                class="rounded-circle member-avatar"
              />
              <span class="badge badge-red" *ngIf="room.members.length > 2"
                >+{{ room.members.length - 2 }}</span
              >
            </div>
          </div>
          <div class="d-flex justify-content-around">
            <button
              class="btn btn-link text-white p-0"
              (click)="viewRoomDetail(room)"
            >
              <i class="fas fa-eye"></i>
            </button>
            <button
              class="btn btn-link text-white p-0"
              (click)="joinRoom(room.id)"
              *ngIf="room.privacy == 0"
            >
              <i class="fas fa-phone"></i>
            </button>
            <button
              class="btn btn-link text-white p-0"
              (click)="openModalEnterPassword(room.id)"
              *ngIf="room.privacy == 1"
            >
              <i class="fas fa-phone"></i>
            </button>
            <button class="btn btn-link text-white p-0">
              <i class="fas fa-pen"></i>
            </button>
            <button class="btn btn-link text-white p-0">
              <i class="fa-solid fa-share"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div
  infiniteScroll
  (scrolled)="loadMoreRooms()"
  [infiniteScrollDistance]="1"
  [infiniteScrollThrottle]="300"
>
  <h3 style="font-weight: bold; text-align: center" *ngIf="loading">
    Load More...
  </h3>
  <h3 style="font-weight: bold; text-align: center" *ngIf="loading == false">
    No more data to load
  </h3>
</div>

<app-modal-delete-room
  *ngIf="showModalDeleteRoom"
  [room]="roomToDelete"
  (closeModal)="closeModalDeleteRoom($event)"
></app-modal-delete-room>

<app-modal-add-edit-room
  *ngIf="showModalAddEditRoom"
  (closeModal)="closeModalAddRoom($event)"
  [roomToEdit]="roomToEdit"
  [userId]="user.id"
></app-modal-add-edit-room>

<button class="btn btn-primary scroll-to-top" (click)="scrollToTop()">
  <i class="fas fa-arrow-up"></i>
</button>
<app-modal-enterpassforroomprivate
  *ngIf="showModalEnterPassword"
  (closeModal)="closeModalEnterPassword($event)"
  [roomId]="roomPrivateToOpenModalEnterPass"
></app-modal-enterpassforroomprivate>
