<div class="video-container">
  <button (click)="toggleActivityMenu()" class="activity-button">
    🎬 Chọn Hoạt Động
  </button>
  <div class="activity-menu" *ngIf="showActivityMenu">
    <button (click)="startVideoSharing()" class="activity-item">🎥 Xem Cùng Nhau</button>
    <button (click)="startWhiteboard()" class="activity-item">📝 Whiteboard</button>
  </div>
</div>

<div class="video-popup" *ngIf="showVideoSelection">
  <div class="popup-content">
    <div class="menu">
      <button class="menu-button">☰</button>
      <div class="menu-dropdown">
        <button class="menu-item">⚙ Settings</button>
        <button class="menu-item" (click)="toggleVideoSelection()">🚪 Leave YouTube</button>
      </div>
    </div>

    <!-- Ô tìm kiếm video -->
    <div class="search-container">
      <input type="text" [(ngModel)]="searchQuery" placeholder="Tìm kiếm video" class="search-box">
      <button (click)="searchVideos()" class="search-button">🔍</button>
    </div>

    <!-- YouTube Player -->
    <div id="youtubePlayer" #videoPlayer></div>

    <!-- Danh sách video tìm kiếm -->
    <h3>Danh sách video</h3>
    <div class="video-list">
      <div class="video-item" *ngFor="let video of videos" (click)="selectVideo(video.id.videoId || video.id)">
        <img [src]="video.snippet.thumbnails.medium.url" alt="Thumbnail">
        <p>{{ video.snippet.title }}</p>
      </div>
    </div>
  </div>
</div>

<!-- Popup cho Whiteboard (nếu có) -->
<div class="whiteboard-popup" *ngIf="showWhiteboard">
  <div class="popup-content">
    <h2>📝 Whiteboard</h2>
    <canvas id="whiteboardCanvas"></canvas>
    <!-- Các tính năng Whiteboard sẽ được thêm vào đây -->
  </div>
</div>
