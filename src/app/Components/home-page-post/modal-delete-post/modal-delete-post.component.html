<div class="delete-modal">
  <div class="modal-overlay" (click)="onCloseModal()"></div>

  <div class="modal-container">
    <div class="modal-header">
      <button class="close-btn" (click)="onCloseModal()">
        <i class="fas fa-times"></i>
      </button>
      <h3 class="modal-title">Confirm Deletion</h3>
    </div>

    <div class="modal-body">
      <div class="post-preview">
        <div class="author-info">
          <img [src]="post.user.picture.url" alt="Author" class="author-avatar" />
          <div class="author-details">
            <div class="author-name">{{ post.user.name }}</div>
            <div class="post-time">{{ ticksToDate(post.createTime) | date : "dd/MM/yy HH:mm" }}</div>
          </div>
        </div>

        <div class="ql-editor" [innerHTML]="post.content | safeHtml"></div>
        <div class="post-media" *ngIf="post.medias.length > 0">
          <div class="media-grid">
            <img *ngFor="let media of post.medias.slice(0, 2)" [src]="media.url" alt="Post media"
              class="media-thumbnail" />
            <div class="media-count" *ngIf="post.medias.length > 2">
              +{{ post.medias.length - 2 }}
            </div>
          </div>
        </div>

        <div class="post-stats">
          <div class="reactions-count">
            <i class="fas fa-thumbs-up"></i>
            <span>{{ post.reactionCounts || 0 }}</span>
          </div>
          <div class="comments-count">
            <i class="fas fa-comment"></i>
            <span>{{ post.commentCount || 0 }}</span>
            <!-- Assuming comment count isn't in your sample data -->
          </div>
        </div>
      </div>

      <div class="confirmation-message">
        Are you sure you want to delete this post?
      </div>
    </div>

    <div class="modal-footer">
      <button class="cancel-btn" (click)="onCloseModal()">Cancel</button>
      <button class="delete-btn" (click)="onDeletePost()">Delete Post</button>
    </div>
  </div>
</div>
