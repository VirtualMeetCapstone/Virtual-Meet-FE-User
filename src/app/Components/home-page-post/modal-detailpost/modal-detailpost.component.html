<div class="modal">
  <div class="modal-content">
    <div class="title">
      <i
        class="fa-solid fa-x iconX d-flex justify-content-end"
        (click)="onCloseModal()"
        style="cursor: pointer"
      ></i>
    </div>
    <div class="post">
      <div class="image-container">
        <button
          (click)="prevImage()"
          class="nav-button fa-solid fa-arrow-left"
        ></button>
        <img
          [src]="post.medias[currentImageIndex]?.url"
          alt="Hình ảnh bài viết"
          class="post-image"
        />
        <button
          (click)="nextImage()"
          class="nav-button next-button fa-solid fa-arrow-right"
        ></button>
      </div>
      <div class="post-content">
        <div class="post-header">
          <img
            [src]="post.user.picture.url"
            alt="Profile picture"
            height="40"
            width="40"
          />
          <div class="username">
            {{ post.user.name }}
            <span> • Following </span>
          </div>
        </div>
        <div class="post-text">
          <p>{{ post.content }}</p>
        </div>
        <div class="post-actions">
          <div class="icons">
            <i class="far fa-heart"> </i>
            <i class="far fa-comment"> </i>
            <i class="far fa-paper-plane"> </i>
          </div>
          <div class="time">7 hours ago</div>
        </div>
        <div class="comments-section">
          <h5>Bình luận</h5>
          <div *ngFor="let comment of groupedComments" class="comment">
            <!-- <img
              [src]="comment.author.picture.Url"
              alt="Ảnh đại diện"
              class="comment-avatar"
            /> -->
            <div class="d-flex">
              <img
                src="
        https://www.researchgate.net/publication/360118941/figure/fig4/AS:11431281275465195@1725399754973/Meteorological-YSI-EXO2-sonde-and-miniDOT-data-recorded-in-URRL-during-the-winter-of.tif
      "
                alt="Ảnh đại diện"
                class="comment-avatar"
              />
              <div class="comment-author">{{ comment.author.name }}</div>
            </div>

            <div class="comment-content">
              <div class="comment-text">{{ comment.content }}</div>
              <div class="comment-time"></div>
            </div>

            <!-- Hiển thị reply -->
            <div class="replies" *ngIf="comment.replies.length > 0">
              <div *ngFor="let reply of comment.replies" class="reply">
                <!-- <img
                  [src]="reply.author.picture.Url"
                  alt="Ảnh đại diện"
                  class="comment-avatar"
                /> -->
                <div class="d-flex">
                  <img
                    src="
              https://www.researchgate.net/publication/360118941/figure/fig4/AS:11431281275465195@1725399754973/Meteorological-YSI-EXO2-sonde-and-miniDOT-data-recorded-in-URRL-during-the-winter-of.tif
            "
                    alt="Ảnh đại diện"
                    class="comment-avatar"
                  />
                  <div class="comment-author">{{ comment.author.name }}</div>
                </div>
                <div class="comment-content">
                  <div class="comment-text">{{ reply.content }}</div>
                  <div class="comment-time"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="post-comment">
          <input placeholder="Add a comment..." type="text" />
          <button>Post</button>
        </div>
      </div>
    </div>
  </div>
</div>
